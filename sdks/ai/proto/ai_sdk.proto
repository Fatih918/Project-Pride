syntax = "proto3";

package pride.ai.v1;

option go_package = "pride-ai-sdk/proto;aiv1";

import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";

service AIService {
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
}

message ExecuteRequest {
  string request_id = 1;
  string capability = 2;
  google.protobuf.Any input = 3;
  google.protobuf.Struct metadata = 4;
}

message ExecuteResponse {
  string request_id = 1;
  string capability = 2;
  google.protobuf.Any output = 3;
  google.protobuf.Struct metadata = 4;
}

message AIError {
  string request_id = 1;
  string error_code = 2;
  string message = 3;
  google.protobuf.Struct metadata = 4;
}

// Canonical input for the text.generate capability.
message TextGenerateInput {
  string prompt = 1;
}

// Canonical output for the text.generate capability.
message TextGenerateOutput {
  string text = 1;
}