name: AI Module Race Tests

on:
  pull_request:
    paths:
      - "Modules/AI_Module/**"
      - ".github/workflows/ai-module-race.yml"
  push:
    branches:
      - main
    paths:
      - "Modules/AI_Module/**"
      - ".github/workflows/ai-module-race.yml"

permissions:
  contents: read

jobs:
  race:
    name: Go race detector
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Modules/AI_Module
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: Modules/AI_Module/go.mod
          cache-dependency-path: Modules/AI_Module/go.sum

      - name: Run tests with race detector
        run: go test -race ./...
