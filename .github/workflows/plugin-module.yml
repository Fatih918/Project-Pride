name: Plugin Module

on:
  pull_request:
    paths:
      - "Modules/Plugin_Module/**"
      - ".github/workflows/plugin-module.yml"
  push:
    branches:
      - main
    paths:
      - "Modules/Plugin_Module/**"
      - ".github/workflows/plugin-module.yml"

permissions:
  contents: read

jobs:
  verify-module:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Modules/Plugin_Module
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: Modules/Plugin_Module/go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...
